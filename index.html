<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 명함 생성기</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; box-sizing: border-box; }
        .input-section input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .input-section button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .input-section button:hover { background-color: #0056b3; }
        .profile-card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; display: none; text-align: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background-color: #e9ecef; margin-bottom: 15px; }
        .profile-name { font-size: 24px; font-weight: bold; margin: 0 0 10px 0; color: #333; }
        .profile-content { text-align: left; margin-top: 20px; font-size: 15px; line-height: 1.6; color: #555; border-top: 1px solid #eee; padding-top: 20px; }
        .profile-content img { max-width: 100%; height: auto; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="input-section">
        <h3>🔗 명함 정보 가져오기</h3>
        <input type="text" id="blogUrl" placeholder="Blogger 글 주소를 입력하세요">
        <button onclick="fetchProfile()">JSON으로 가져오기</button>
    </div>

    <div class="profile-card" id="profileCard">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="profile-img">
        <h2 class="profile-name" id="nameArea">이름</h2>
        <div class="profile-content" id="contentArea">내용을 불러오는 중입니다...</div>
    </div>

    <script>
        function fetchProfile() {
            const inputUrl = document.getElementById("blogUrl").value.trim();
            if (!inputUrl) {
                alert("URL을 입력해주세요!");
                return;
            }

            try {
                const urlObj = new URL(inputUrl);
                const origin = urlObj.origin;
                const path = urlObj.pathname;
                
                // 1. 원래 가져오려던 블로그 JSON 주소
                const jsonUrl = `${origin}/feeds/posts/default?alt=json&path=${path}`;

                // ★ 2. CORS 차단 에러를 해결하기 위한 무료 프록시 주소 적용
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(jsonUrl)}`;

                // 3. 기존 jsonUrl 대신 proxyUrl을 통해 우회해서 데이터 요청
                fetch(proxyUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("네트워크 응답이 올바르지 않습니다.");
                        return response.json();
                    })
                    .then(data => {
                        if (!data.feed || !data.feed.entry || data.feed.entry.length === 0) {
                            alert("데이터를 찾을 수 없습니다. URL을 확인해주세요.");
                            return;
                        }

                        const entry = data.feed.entry[0];
                        const name = entry.title.$t;
                        const content = entry.content.$t;

                        document.getElementById("nameArea").innerText = name;
                        document.getElementById("contentArea").innerHTML = content;
                        document.getElementById("profileCard").style.display = "block";

                        const newUrl = "/" + encodeURIComponent(name);
                        window.history.pushState({ path: newUrl }, '', newUrl);
                    })
                    .catch(error => {
                        console.error("에러 발생:", error);
                        alert("데이터 가져오기 실패 (CORS 또는 네트워크 문제): " + error.message);
                    });
            } catch (e) {
                alert("유효한 URL이 아닙니다. 정확한 주소를 입력해주세요.");
            }
        }
    </script>
</body>
</html>
